name: Build TWRP Recovery

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-11
          - twrp-10
      DEVICE_TREE_URL:
        description: 'Device Tree Repository URL'
        required: true
        default: 'https://github.com/PomuSanza/ofrp_device_xiaomi_cezanne.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12'
      DEVICE_PATH:
        description: 'Device Path in Source Tree'
        required: true
        default: 'device/xiaomi/cezanne'
      DEVICE_CODENAME:
        description: 'Device Codename'
        required: true
        default: 'cezanne'
      USE_CCACHE:
        description: 'Use ccache for faster builds'
        type: boolean
        required: true
        default: true
      CLEAN_BUILD:
        description: 'Perform clean build (remove out directory)'
        type: boolean
        required: true
        default: true

env:
  WORKSPACE_DIR: 'twrp-build'
  CCACHE_DIR: '/tmp/ccache'

jobs:
  build:
    name: Build TWRP for ${{ inputs.DEVICE_CODENAME }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    - name: Set Build Variables
      id: vars
      run: |
        echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +%H%M%S)" >> $GITHUB_ENV
    
    - name: Maximize Build Space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 4096
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
    
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git-core \
          gnupg \
          flex \
          bison \
          build-essential \
          zip \
          curl \
          zlib1g-dev \
          gcc-multilib \
          g++-multilib \
          libc6-dev-i386 \
          x11proto-core-dev \
          libx11-dev \
          libgl1-mesa-dev \
          libxml2-utils \
          xsltproc \
          unzip \
          fontconfig \
          python3 \
          python3-pip \
          repo \
          aria2 \
          zstd \
          schedtool
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      if: inputs.USE_CCACHE
      with:
        key: ${{ github.run_id }}
        max-size: 2G
        create-symlink: true
    
    - name: Setup Build Environment
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        
        # Set git config
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
        # Initialize repo
        repo init \
          --depth=1 \
          -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
          -b ${{ inputs.TWRP_MANIFEST_BRANCH }}
    
    - name: Sync Source Code
      run: |
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        
        # Apply common patches if needed
        if [[ "${{ inputs.TWRP_MANIFEST_BRANCH }}" == "twrp-12.1" ]]; then
          source build/envsetup.sh
          
          # Apply known patches for TWRP 12.1
          repopick 5405  # Example patch IDs, adjust as needed
          repopick 5540
          repopick 5639
          repopick 5675
          repopick 5689
          repopick 5690
          repopick 5691
          repopick 5693
          repopick 5694
          repopick 5724
          repopick 5743
        fi
    
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        
        # Remove existing device tree if exists
        rm -rf ./${{ inputs.DEVICE_PATH }}
        
        # Clone device tree
        git clone \
          ${{ inputs.DEVICE_TREE_URL }} \
          -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ./${{ inputs.DEVICE_PATH }}
        
        # Store commit hash
        cd ./${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "COMMIT_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
    
    - name: Setup Build Environment Variables
      run: |
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        
        # Source build environment
        source build/envsetup.sh
        
        # Set build variables
        if [[ "${{ inputs.USE_CCACHE }}" == "true" ]]; then
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 2G
          ccache -s
        fi
        
        export ALLOW_MISSING_DEPENDENCIES=true
        
        # Lunch the device
        lunch twrp_${{ inputs.DEVICE_CODENAME }}-eng
    
    - name: Clean Previous Build
      if: inputs.CLEAN_BUILD
      run: |
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        make clean
    
    - name: Build Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        
        # Source environment again to be safe
        source build/envsetup.sh
        lunch twrp_${{ inputs.DEVICE_CODENAME }}-eng
        
        # Build recovery image
        mka recoveryimage -j$(nproc --all)
        
        echo "Build completed!"
        
        # Show build output
        echo "Build output location:"
        ls -la out/target/product/${{ inputs.DEVICE_CODENAME }}/recovery.img
        ls -la out/target/product/${{ inputs.DEVICE_CODENAME }}/*.zip || true
    
    - name: Prepare Artifacts
      run: |
        cd ${GITHUB_WORKSPACE}/${WORKSPACE_DIR}
        
        # Create artifacts directory
        mkdir -p ${GITHUB_WORKSPACE}/artifacts
        
        # Copy recovery image
        cp out/target/product/${{ inputs.DEVICE_CODENAME }}/recovery.img \
          ${GITHUB_WORKSPACE}/artifacts/twrp-${{ inputs.DEVICE_CODENAME }}-${{ env.BUILD_DATE }}.img
        
        # Copy any zip files (if available)
        if ls out/target/product/${{ inputs.DEVICE_CODENAME }}/*.zip 1> /dev/null 2>&1; then
          cp out/target/product/${{ inputs.DEVICE_CODENAME }}/*.zip \
            ${GITHUB_WORKSPACE}/artifacts/
        fi
        
        # Create build info file
        cat > ${GITHUB_WORKSPACE}/artifacts/build-info.txt << EOF
        TWRP Build Information
        ======================
        Device: ${{ inputs.DEVICE_CODENAME }}
        Build Date: ${{ env.BUILD_DATE }}
        Build Time: ${{ env.BUILD_TIME }}
        TWRP Branch: ${{ inputs.TWRP_MANIFEST_BRANCH }}
        Device Tree: ${{ inputs.DEVICE_TREE_URL }}
        Device Tree Branch: ${{ inputs.DEVICE_TREE_BRANCH }}
        Commit ID: ${{ env.COMMIT_ID }}
        Short Commit: ${{ env.COMMIT_SHORT }}
        CCache Enabled: ${{ inputs.USE_CCACHE }}
        Clean Build: ${{ inputs.CLEAN_BUILD }}
        
        Build completed successfully!
        EOF
        
        # Show artifacts
        echo "Artifacts created:"
        ls -la ${GITHUB_WORKSPACE}/artifacts/
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-${{ inputs.DEVICE_CODENAME }}-${{ env.BUILD_DATE }}
        path: |
          artifacts/*
        retention-days: 7
    
    - name: Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        name: TWRP for ${{ inputs.DEVICE_CODENAME }} - ${{ env.BUILD_DATE }}
        tag_name: twrp-${{ inputs.DEVICE_CODENAME }}-${{ env.BUILD_DATE }}
        body: |
          ## TWRP Recovery Build
          
          ### Build Information
          - **Device**: ${{ inputs.DEVICE_CODENAME }}
          - **Build Date**: ${{ env.BUILD_DATE }}
          - **TWRP Branch**: ${{ inputs.TWRP_MANIFEST_BRANCH }}
          - **Device Tree**: [${{ inputs.DEVICE_TREE_URL }}](${{ inputs.DEVICE_TREE_URL }})
          - **Device Tree Branch**: ${{ inputs.DEVICE_TREE_BRANCH }}
          - **Latest Commit**: [${{ env.COMMIT_SHORT }}](${{ inputs.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
          
          ### Usage
          1. Download the recovery.img file
          2. Flash using fastboot: `fastboot flash recovery recovery.img`
          3. Reboot to recovery
          
          ### Notes
          - This is an unofficial build
          - Use at your own risk
          - Always backup your data before flashing
        draft: false
        prerelease: false
  
